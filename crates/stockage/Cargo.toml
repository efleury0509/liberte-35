[package]
name = "l35-stockage"
description = "Stockage local de Liberté 35 : fichier SQLite, versions du schéma, journal des changements."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# « bundled » intègre SQLite à l'application : rien à installer sur Windows.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Jour local pour nommer la copie du jour (Windows : fuseau du système).
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
# Export portable : dossier compressé lisible partout.
zip = { version = "=9.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.27.0"
