# Vérifie le projet et fabrique les deux installateurs Windows
# (Essai et officiel) sur une machine Windows de GitHub.
# Gratuit dans le quota de GitHub ; aucun secret n'est utilisé.

name: Fabrication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Écriture : seulement pour poser l'étiquette « vX.Y.Z » d'une version publiée.
  contents: write

concurrency:
  group: fabrication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Tests et installateurs Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le code (avec les étiquettes de version)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust (version figée dans rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Installer les dépendances (versions figées)
        run: npm ci

      - name: Vérifier le numéro de version
        id: version
        run: node scripts/verifier_version.mjs

      - name: Vérifier les types
        run: npm run verifier

      - name: Tests unitaires de l'interface (dont l'absence de secrets)
        run: npm test

      - name: Tests de parcours dans un navigateur
        run: |
          npx playwright install chromium
          npm run e2e

      - name: Tests du stockage
        run: cargo test -p l35-stockage --locked

      - name: Fabriquer l'installateur Essai
        run: npm run fabriquer:essai

      - name: Fabriquer l'installateur Essai vierge (répétitions de première utilisation)
        run: npm run fabriquer:essai-vierge

      - name: Fabriquer l'installateur officiel
        run: npm run fabriquer:officielle

      - name: Publier l'installateur Essai
        if: steps.version.outputs.publier == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: liberte-35-essai-${{ steps.version.outputs.version }}
          path: target/release/bundle/nsis/*Essai_*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publier l'installateur Essai vierge
        if: steps.version.outputs.publier == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: liberte-35-essai-vierge-${{ steps.version.outputs.version }}
          path: target/release/bundle/nsis/*Essai vierge_*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publier l'installateur officiel
        if: steps.version.outputs.publier == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: liberte-35-officiel-${{ steps.version.outputs.version }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            !target/release/bundle/nsis/*Essai*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Marquer la version publiée
        if: steps.version.outputs.publier == 'true' && steps.version.outputs.etiquette_existe != 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
